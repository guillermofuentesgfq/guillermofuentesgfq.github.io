        end_date: 2016-01
        highlights:
          - Specialization in BPMN Models and business process modeling.

    Experience:
      - company: Buk SpA
        position: Head of Engineering
        location: Chile (Remote from Spain)
        start_date: 2025-09
        end_date: present
        summary: Leading a 9-team organization (45+ engineers) at an HR technology company providing HCM, LMS, attendance control, and payroll solutions to millions of users across Latin America. Own platform engineering, CI/CD, and Ruby on Rails development.
        highlights:
          - Scaled the engineering organization from 1 to 9 teams in under 18 months, establishing team charters, career ladders, and delivery frameworks.
          - Founded the DevEx-AI team and built an agent orchestrator for automated code review, feature flag cleanup, and Sentry error resolution — reducing manual toil by an estimated 40%.
          - Leading the observability transformation with OpenTelemetry, replacing legacy monitoring with unified distributed tracing — reducing MTTR from hours to minutes.
          - Define technical strategy, OKRs, and roadmaps in partnership with Product and Design.

      - company: Buk SpA
        position: Engineering Manager
        location: Chile (Remote from Spain)
        start_date: 2024-05
        end_date: 2025-08
        summary: Managed a team of 6 engineers responsible for the infrastructure and core features of a Learning Management System (LMS) serving 2M+ active users.
        highlights:
          - Reduced infrastructure costs by 30% through Horizontal Pod Autoscaling (HPA), right-sizing, and AWS region migration.
          - Revamped deployment processes introducing ephemeral PR-based environments and automated CI/CD pipelines, accelerating feedback cycles from days to minutes.
          - Adopted a Platform as a Product approach, treating internal tooling as a product with clear SLIs and iterative improvement cycles.
          - Led the hiring and onboarding of 8 engineers, reducing ramp-up time by 30%.

      - company: Buk SpA
        position: Staff Software Engineer
        location: Chile (Remote from Spain)
        start_date: 2021-09
        end_date: 2024-03
        summary: Led technical design and end-to-end feature delivery for an LMS used by 500+ organizations, using Symfony and React, with 99.9% uptime requirements.
        highlights:
          - Implemented HPA driven by RabbitMQ metrics, reducing average CPU waste by 25% and preventing recurring production incidents.
          - Mentored 4 junior and mid-level engineers, reducing technical debt by 20% through systematic upgrades and static analysis in CI.
          - Drove the migration from a monolithic Symfony application to a service-oriented architecture.

      - company: Freelance
        position: Software Engineer
        location: Chile
        start_date: 2015
        end_date: 2020
        summary: Delivered custom web applications across e-commerce, logistics, and education using Symfony, PHP, and JavaScript — managing full project lifecycles.
        highlights:
          - Achieved a 90%+ repeat engagement rate through reliable delivery and post-launch support.

