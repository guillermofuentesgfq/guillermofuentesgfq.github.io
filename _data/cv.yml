  label: Head of Engineering
  email:
  location: Spain
  image: ""
  summary: Engineering leader and Head of Engineering with 8+ years of experience driving platform modernization, AI-enabled development, and product transformation across multidisciplinary teams. Currently leading a 9-team engineering organization spanning DevEx, AI-powered developer tools, DevOps, DevSecOps, and platform engineering. Hands-on technical expertise in Ruby on Rails, Kubernetes, AWS, and Symfony, with a Doctorate in Advanced Computing Technologies (BizDevOps & Enterprise Architecture).

