        studyType: Doctorate
        start_date: 2020-12
        end_date: 2025-02
        highlights:
          - Specialization in BizDevOps and Enterprise Architecture. Thesis on aligning software development approaches with enterprise architecture frameworks to improve IT/business alignment in DevOps-driven organizations.
          - Published 4 peer-reviewed papers in top-tier journals (Information Systems Frontiers, Journal of Software: Evolution and Process) and international conferences (ICEIS).

      - institution: University of Bío-Bío, Chile
        area: Computer Science
